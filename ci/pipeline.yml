---
custom:
  timeouts:
    long: &timeouts-long 3h
  debug_bats: &debug_bats true

jobs:
- name: create-openstack-cpi-release-docker-image
  serial: true
  plan:
  - get: bosh-openstack-cpi-release
  - task: build-image
    privileged: true
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: concourse/oci-build-task
      inputs:
      - name: bosh-openstack-cpi-release
      outputs:
      - name: image
      params:
        CONTEXT: bosh-openstack-cpi-release/ci/docker/openstack-cpi-release
      run:
        path: build
  - put: openstack-cpi-release-docker-image
    no_get: true
    params:
      image: image/image.tar

- name: run-specs
  serial: true
  plan:
  - in_parallel:
    - get: bosh-openstack-cpi-release
      timeout: *timeouts-long
      trigger: true
  - task: run-golang-unit-specs
    file: bosh-openstack-cpi-release/ci/tasks/run-golang-unit-specs.yml
  - task: run-golang-integration-specs
    file: bosh-openstack-cpi-release/ci/tasks/run-golang-integration-specs.yml

- name: run-devstack-tests
  serial: true
  serial_groups: [ devstack ]
  plan:
  - do:
    - in_parallel:
      - get: bosh-openstack-cpi-release
        passed: [ run-specs ]
        timeout: *timeouts-long
        trigger: true
      - get: openstack-lifecycle-stemcell
        resource: openstack-ubuntu-noble-stemcell
        timeout: *timeouts-long
      - get: terraform-image
      - get: openstack-cpi-release-docker-image
      - get: stemcell
        resource: openstack-ubuntu-noble-stemcell
        timeout: *timeouts-long
      - get: bats
        timeout: *timeouts-long
      - get: bosh-deployment
        timeout: *timeouts-long

    - put: gcp-devstack
      params:
        terraform_source: bosh-openstack-cpi-release/ci/terraform/ci/gcp-devstack
    - task: wait-for-devstack
      image: openstack-cpi-release-docker-image
      file: bosh-openstack-cpi-release/ci/tasks/wait-for-devstack.yml
      params:
        AUTH_URL: http://10.100.30.2/identity
        OS_USERNAME: ((openstack_ci_user.username))
        OS_PASSWORD: ((openstack_ci_user.password))
        OS_PROJECT: bosh

    - task: lifecycle-apply-terraform
      timeout: *timeouts-long
      image: terraform-image
      file: bosh-openstack-cpi-release/ci/tasks/terraform-apply-lifecycle.yml
      params: &lifecycle-terraform-params
        TF_VAR_prefix: "lifecycle-openstack-tests"
        TF_VAR_auth_url: http://10.100.30.2/identity
        TF_VAR_user_name: ((openstack_ci_user.username))
        TF_VAR_password: ((openstack_ci_user.password))
        TF_VAR_domain_name: Default
        TF_VAR_project_name: bosh
        TF_VAR_ext_net_name: public
        TF_VAR_region_name: RegionOne
        TF_VAR_openstack_default_key_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHspetaTfg96YfZO3/xjKxGcjTnFPlxp7uP1KDisvPjB devstack-ci-openstack
        TF_VAR_dns_nameservers: '["8.8.8.8"]'
        TF_VAR_use_lbaas: false

    - do:
      - task: run-golang-lifecycle-specs
        timeout: *timeouts-long
        file: bosh-openstack-cpi-release/ci/tasks/run-golang-lifecycle-specs.yml
        params:
          BOSH_OPENSTACK_DOMAIN: Default
          BOSH_OPENSTACK_AUTH_URL_V3: http://10.100.30.2/identity
          BOSH_OPENSTACK_USERNAME_V3: ((openstack_ci_user.username))
          BOSH_OPENSTACK_API_KEY_V3: ((openstack_ci_user.password))
          BOSH_OPENSTACK_PROJECT: bosh
          BOSH_OPENSTACK_VOLUME_TYPE: lvmdriver-1
          BOSH_OPENSTACK_FLAVOR_WITH_NO_ROOT_DISK: no-root-disk
          BOSH_OPENSTACK_AVAILABILITY_ZONE: nova
      ensure:
        task: lifecycle-destroy-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-destroy-lifecycle.yml
        params: *lifecycle-terraform-params

    - do:
      - task: bats-apply-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-apply-bats-manual.yml
        params: &bats-terraform-vars
          TF_VAR_prefix: "bats-ubuntu-manual"
          TF_VAR_auth_url: http://10.100.30.2/identity
          TF_VAR_domain_name: Default
          TF_VAR_user_name: ((openstack_ci_user.username))
          TF_VAR_password: ((openstack_ci_user.password))
          TF_VAR_project_name: bosh
          TF_VAR_region_name: RegionOne
          TF_VAR_primary_net_name: "bats-ubuntu-manual-primary"
          TF_VAR_primary_net_cidr: "10.0.4.0/24"
          TF_VAR_primary_net_allocation_pool_start: "10.0.4.200"
          TF_VAR_primary_net_allocation_pool_end: "10.0.4.254"
          TF_VAR_secondary_net_name: "bats-ubuntu-manual-secondary"
          TF_VAR_secondary_net_cidr: "10.0.5.0/24"
          TF_VAR_secondary_net_allocation_pool_start: "10.0.5.200"
          TF_VAR_secondary_net_allocation_pool_end: "10.0.5.254"
          TF_VAR_ext_net_name: public
          TF_VAR_ext_net_cidr: 172.24.4.0/24
          TF_VAR_dns_nameservers: '["8.8.8.8"]'
          TF_VAR_concourse_external_network_cidr: 0.0.0.0/0
          TF_VAR_openstack_default_key_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHspetaTfg96YfZO3/xjKxGcjTnFPlxp7uP1KDisvPjB devstack-ci-openstack

      - task: bats-deploy-director
        timeout: *timeouts-long
        file: bosh-openstack-cpi-release/ci/tasks/deploy-manual-networking.yml
        params:
          openstack_flavor: "m1.small"
          openstack_connection_timeout: "600"
          openstack_read_timeout: "180"
          openstack_write_timeout: "180"
          openstack_state_timeout: "900"
          openstack_auth_url: http://10.100.30.2/identity
          openstack_username: ((openstack_ci_user.username))
          openstack_api_key: ((openstack_ci_user.password))
          openstack_domain: Default
          availability_zone: nova
          DEBUG_BATS: *debug_bats

      - task: run-bats
        timeout: *timeouts-long
        file: bosh-openstack-cpi-release/ci/tasks/run-manual-networking-bats.yml
        params:
          stemcell_name: "bosh-openstack-kvm-ubuntu-noble"
          openstack_flavor_with_ephemeral_disk: with-ephemeral-disk
          openstack_flavor_with_no_ephemeral_disk: without-ephemeral-disk
          availability_zone: nova
          DEBUG_BATS: *debug_bats
          bats_rspec_tags: "--tag ~ssh"
        ensure:
          task: bats-print-errors
          timeout: *timeouts-long
          file: bosh-openstack-cpi-release/ci/tasks/print_task_errors.yml

      ensure:
        task: bats-destroy-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-destroy-bats-manual.yml

    ensure:
      put: destroy-devstack
      resource: gcp-devstack
      params:
        terraform_source: bosh-openstack-cpi-release/ci/terraform/ci/gcp-devstack
        action: destroy
      get_params:
        action: destroy

- name: run-devstack-tests-ruby-cpi
  serial: true
  serial_groups: [ devstack ]
  plan:
  - do:
    - in_parallel:
      - get: bosh-openstack-cpi-release
        passed: [ run-devstack-tests ]
        timeout: *timeouts-long
        trigger: true
      - get: openstack-lifecycle-stemcell
        resource: openstack-ubuntu-noble-stemcell
        timeout: *timeouts-long
      - get: terraform-image
      - get: openstack-cpi-release-docker-image
      - get: stemcell
        resource: openstack-ubuntu-noble-stemcell
        timeout: *timeouts-long
      - get: bats
        timeout: *timeouts-long
      - get: bosh-deployment
        timeout: *timeouts-long

    - put: gcp-devstack
      params:
        terraform_source: bosh-openstack-cpi-release/ci/terraform/ci/gcp-devstack
    - task: wait-for-devstack
      image: openstack-cpi-release-docker-image
      file: bosh-openstack-cpi-release/ci/tasks/wait-for-devstack.yml
      params:
        AUTH_URL: http://10.100.30.2/identity
        OS_USERNAME: ((openstack_ci_user.username))
        OS_PASSWORD: ((openstack_ci_user.password))
        OS_PROJECT: bosh

    - task: lifecycle-apply-terraform
      timeout: *timeouts-long
      image: terraform-image
      file: bosh-openstack-cpi-release/ci/tasks/terraform-apply-lifecycle.yml
      params: *lifecycle-terraform-params

    - do:
      - task: run-lifecycle
        timeout: *timeouts-long
        image: openstack-cpi-release-docker-image
        file: bosh-openstack-cpi-release/ci/tasks/run-lifecycle.yml
        params:
          BOSH_OPENSTACK_DOMAIN: Default
          BOSH_OPENSTACK_PROJECT: bosh
          BOSH_OPENSTACK_USERNAME_V3: ((openstack_ci_user.username))
          BOSH_OPENSTACK_AUTH_URL_V3: http://10.100.30.2/identity
          BOSH_OPENSTACK_API_KEY_V3: ((openstack_ci_user.password))
          BOSH_CLI_SILENCE_SLOW_LOAD_WARNING: true
          BOSH_OPENSTACK_VOLUME_TYPE: lvmdriver-1
          BOSH_OPENSTACK_CONNECT_TIMEOUT: "600"
          BOSH_OPENSTACK_READ_TIMEOUT: "120"
          BOSH_OPENSTACK_WRITE_TIMEOUT: "120"
          BOSH_OPENSTACK_FLAVOR_WITH_NO_ROOT_DISK: no-root-disk
          BOSH_OPENSTACK_AVAILABILITY_ZONE: nova
          BOSH_OPENSTACK_EXCLUDE_CINDER_V1: true
      ensure:
        task: lifecycle-destroy-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-destroy-lifecycle.yml
        params: *lifecycle-terraform-params

    - do:
      - task: bats-apply-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-apply-bats-manual.yml
        params: *bats-terraform-vars

      - task: bats-deploy-director
        timeout: *timeouts-long
        image: openstack-cpi-release-docker-image
        file: bosh-openstack-cpi-release/ci/tasks/deploy-manual-networking.yml
        params:
          openstack_flavor: "m1.small"
          openstack_connection_timeout: "600"
          openstack_read_timeout: "180"
          openstack_write_timeout: "180"
          openstack_state_timeout: "900"
          openstack_auth_url: http://10.100.30.2/identity
          openstack_username: ((openstack_ci_user.username))
          openstack_api_key: ((openstack_ci_user.password))
          openstack_domain: Default
          availability_zone: nova
          DEBUG_BATS: *debug_bats
          USE_GOLANG_CPI: "false"

      - task: run-bats
        timeout: *timeouts-long
        file: bosh-openstack-cpi-release/ci/tasks/run-manual-networking-bats.yml
        params:
          stemcell_name: "bosh-openstack-kvm-ubuntu-noble"
          openstack_flavor_with_ephemeral_disk: with-ephemeral-disk
          openstack_flavor_with_no_ephemeral_disk: without-ephemeral-disk
          availability_zone: nova
          DEBUG_BATS: *debug_bats
          bats_rspec_tags: "--tag ~ssh"
        ensure:
          task: bats-print-errors
          timeout: *timeouts-long
          file: bosh-openstack-cpi-release/ci/tasks/print_task_errors.yml

      ensure:
        task: bats-destroy-terraform
        timeout: *timeouts-long
        image: terraform-image
        file: bosh-openstack-cpi-release/ci/tasks/terraform-destroy-bats-manual.yml

    ensure:
      put: destroy-devstack
      resource: gcp-devstack
      params:
        terraform_source: bosh-openstack-cpi-release/ci/terraform/ci/gcp-devstack
        action: destroy
      get_params:
        action: destroy

- name: bump-major
  serial_groups: [ version ]
  plan:
    - put: release-version-semver
      params:
        bump: major

- name: bump-minor
  serial_groups: [ version ]
  plan:
    - put: release-version-semver
      params:
        bump: minor

- name: bump-patch
  serial_groups: [ version ]
  plan:
    - put: release-version-semver
      params:
        bump: patch

- name: automatically-release-new-patch
  serial_groups: [ version ]
  plan:
    - in_parallel:
        - get: bosh-openstack-cpi-release
          trigger: true
          passed:
            - run-devstack-tests
        - get: bosh-shared-ci
        - get: version
          resource: release-version-semver
        - get: patched-version
          resource: release-version-semver
          params:
            bump: patch
        - get: bosh-security-scanner-registry-image
    - try:
        task: check-for-patched-cves
        file: bosh-shared-ci/tasks/release/check-for-patched-cves.yml
        image: bosh-security-scanner-registry-image
        input_mapping:
          input_repo: bosh-openstack-cpi-release
        params:
          GIT_PRIVATE_KEY: ((github_deploy_key_bosh-openstack-cpi-release.private_key))
          SEVERITY: CRITICAL,HIGH
        on_success:
          do:
            - put: release-notes
              params:
                file: release-notes/release-notes.md
            - put: release-version-semver
              params:
                file: patched-version/version
    - task: ensure-cve-checker-succeeded
      file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
      image: bosh-security-scanner-registry-image
      input_mapping:
        task-output-folder: patched_cves
    - try:
        task: check-for-updated-vendored-packages
        file: bosh-shared-ci/tasks/release/check-for-updated-vendored-packages.yml
        image: bosh-security-scanner-registry-image
        input_mapping:
          input_repo: bosh-openstack-cpi-release
        params:
          PACKAGES:
            - golang-1-linux
        on_success:
          do:
            - put: release-notes
              params:
                file: release-notes/release-notes.md
            - put: release-version-semver
              params:
                file: patched-version/version
    - task: ensure-vendored-package-checker-succeeded
      file: bosh-shared-ci/tasks/release/ensure-task-succeeded.yml
      image: bosh-security-scanner-registry-image
      input_mapping:
        task-output-folder: package-updates

- name: promote-candidate
  disable_manual_trigger: true
  serial_groups: [ version ]
  plan:
  - in_parallel:
    - get: bosh-shared-ci
    - get: bosh-openstack-cpi-release
      passed:
      - run-devstack-tests
    - get: version
      resource: release-version-semver
      trigger: true
    - get: release-notes
  - task: promote
    timeout: *timeouts-long
    file: bosh-shared-ci/tasks/release/create-final-release.yml
    input_mapping:
      release_repo: bosh-openstack-cpi-release
    params:
      GIT_USER_NAME: CI Bot
      GIT_USER_EMAIL: bots@cloudfoundry.org
      PRIVATE_YML: |
        blobstore:
          provider: gcs
          options:
            credentials_source: static
            json_key: '((gcp_json_key))'
  - put: bosh-openstack-cpi-release
    timeout: *timeouts-long
    params:
      repository: release_repo
      rebase: true
      tag: release_metadata/tag-name
  - put: bosh-openstack-cpi-release-github-release
    params:
      name: release_metadata/tag-name
      tag: release_metadata/tag-name
      body: release-notes/release-notes
      commitish: bosh-openstack-cpi-release/.git/ref
      generate_release_notes: true
  - put: release-notes
    params:
      file: release_metadata/empty-file

- name: bump-go-deps
  plan:
  - in_parallel:
    - get: bosh-openstack-cpi-release
    - get: golang-release
    - get: openstack-cpi-release-docker-image
    - get: weekly
      trigger: true
  - task: bump-deps
    file: golang-release/ci/tasks/shared/bump-deps.yml
    input_mapping:
      input_repo: bosh-openstack-cpi-release
    output_mapping:
      output_repo: bosh-openstack-cpi-release
    params:
      SOURCE_PATH: src/openstack_cpi_golang
  - task: run-unit-specs
    file: bosh-openstack-cpi-release/ci/tasks/run-unit-specs.yml
    image: openstack-cpi-release-docker-image
  - task: run-golang-unit-specs
    file: bosh-openstack-cpi-release/ci/tasks/run-golang-unit-specs.yml
  - put: bosh-openstack-cpi-release
    params:
      repository: bosh-openstack-cpi-release
      rebase: true

- name: bump-ruby-deps
  plan:
  - in_parallel:
    - get: bosh-openstack-cpi-release
    - get: ruby-release
    - get: bosh-ruby-release-registry-image
    - get: weekly
      trigger: true
  - load_var: ruby_version
    file: bosh-openstack-cpi-release/src/bosh_openstack_cpi/.ruby-version
    format: trim
    reveal: true
  - task: bump-gems
    image: bosh-ruby-release-registry-image
    file: ruby-release/ci/tasks/shared/bump-gems.yml
    input_mapping:
      input-repo: bosh-openstack-cpi-release
    output_mapping:
      output-repo: bosh-openstack-cpi-release
    params:
      GEM_DIRS: src/bosh_openstack_cpi
      GIT_USER_NAME: CI Bot
      GIT_USER_EMAIL: bots@cloudfoundry.org
      PACKAGE: ruby-((.:ruby_version))
  - put: bosh-openstack-cpi-release
    params:
      repository: bosh-openstack-cpi-release
      rebase: true

- name: bump-bosh-packages
  plan:
  - in_parallel:
    - get: bosh-openstack-cpi-release
    - get: golang-release
      trigger: true
    - get: ruby-release
      trigger: true
    - get: bosh-ruby-release-registry-image
    - get: openstack-cpi-release-docker-image
  - task: bump-ruby-package
    image: bosh-ruby-release-registry-image
    file: ruby-release/ci/tasks/shared/bump-ruby-package.yml
    input_mapping:
      bosh-release: bosh-openstack-cpi-release
    output_mapping:
      bosh-release: bosh-openstack-cpi-release
    params:
      GIT_USER_NAME: CI Bot
      GIT_USER_EMAIL: bots@cloudfoundry.org
      PACKAGE: ruby-3.4
      PACKAGE_PREFIX: openstack
      PRIVATE_YML: |
        blobstore:
          provider: gcs
          options:
            credentials_source: static
            json_key: '((gcp_json_key))'
  - task: bump-golang-packages
    file: golang-release/ci/tasks/shared/bump-golang-package.yml
    input_mapping:
      input_repo: bosh-openstack-cpi-release
    output_mapping:
      output_repo: bosh-openstack-cpi-release
    params:
      PACKAGES: [ golang-1-linux ]
      PRIVATE_YML: |
        blobstore:
          provider: gcs
          options:
            credentials_source: static
            json_key: '((gcp_json_key))'
  - task: run-unit-specs
    file: bosh-openstack-cpi-release/ci/tasks/run-unit-specs.yml
    image: openstack-cpi-release-docker-image
  - put: bosh-openstack-cpi-release
    params:
      repository: bosh-openstack-cpi-release
      rebase: true

resource_types:
- name: terraform
  type: registry-image
  check_every: 168h
  source: &terraform-resource-source-keys
    repository: ljfranklin/terraform-resource
    username: ((dockerhub_username))
    password: ((dockerhub_password))
- name: gcs
  type: registry-image
  check_every: 168h
  source:
    repository: frodenas/gcs-resource
    username: ((dockerhub_username))
    password: ((dockerhub_password))
- name: semver
  type: registry-image
  check_every: 168h
  source:
    repository: concourse/semver-resource
    username: ((dockerhub_username))
    password: ((dockerhub_password))

resources:
- name: gcp-devstack
  type: terraform
  source:
    env_name: openstack-cpi-devstack
    backend_type: gcs
    backend_config:
      bucket: bosh-openstack-cpi-blobs
      prefix: terraform/gcp-devstack
      credentials: ((gcp_json_key))
    vars:
      gcp_credentials_json: ((gcp_json_key))
      os_username: ((openstack_ci_user.username))
      os_password: ((openstack_ci_user.password))

- name: bosh-shared-ci
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-shared-ci.git


- name: release-notes
  type: gcs
  source:
    bucket: bosh-openstack-cpi-blobs
    versioned_file: release-notes
    json_key: ((gcp_json_key))

- name: bosh-openstack-cpi-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-openstack-cpi-release.git
    branch: speed-up-bats-director
    username: bosh-admin-bot
    password: ((github_public_repo_token))

- name: bosh-openstack-cpi-release-github-release
  type: github-release
  source:
    owner: cloudfoundry
    repository: bosh-openstack-cpi-release
    access_token: ((github_public_repo_token))

- name: release-version-semver
  type: semver
  source:
    initial_version: "35.0.0"
    driver: git
    uri: https://github.com/cloudfoundry/bosh-openstack-cpi-release.git
    branch: release-semver
    file: VERSION
    username: ((github_read_write_packages.username))
    password: ((github_read_write_packages.password))

- name: bats
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-acceptance-tests.git
    branch: master

- name: openstack-ubuntu-noble-stemcell
  type: bosh-io-stemcell
  source:
    name: bosh-openstack-kvm-ubuntu-noble

- name: bosh-deployment
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-deployment.git
    branch: master

- name: openstack-cpi-release-docker-image
  type: registry-image
  check_every: never
  source:
    repository: ghcr.io/cloudfoundry/bosh-openstack-cpi-release/openstack-cpi-release
    tag: latest
    username: ((github_read_write_packages.username))
    password: ((github_read_write_packages.password))

- name: bosh-security-scanner-registry-image
  type: registry-image
  check_every: 24h
  source:
    repository: bosh/security-scanner
    username: ((dockerhub_username))
    password: ((dockerhub_password))

- name: golang-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-package-golang-release.git

- name: ruby-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-package-ruby-release.git

- name: bosh-ruby-release-registry-image
  type: registry-image
  source:
    repository: bosh/ruby-release
    username: ((dockerhub_username))
    password: ((dockerhub_password))

- name: weekly
  type: time
  source:
    start: 3:00 -0700
    stop: 4:30 -0700
    days: [ Saturday ]

- name: terraform-image
  type: registry-image
  check_every: 168h
  source: *terraform-resource-source-keys
